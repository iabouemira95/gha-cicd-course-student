# Copy this file to `.github/workflows/08-final-deployment-assessment.yml`
# when you start EX-12.
#
# This starter is intentionally incomplete.
# It is meant to guide your thinking, not to run successfully as-is.
#
# Assessment target:
# - CI runs on pull requests to `main`
# - that CI becomes a required status check for merge
# - after merge, CD builds the image, pushes it to the registry,
#   deploys it over SSH, and validates the running app
#
# Keep the course story visible the whole time:
# code -> verify -> package -> deliver
name: 08 Final Deployment Assessment

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

env:
  IMAGE_NAME: tiny-health-app
  APP_PORT: "8000"
  PR_SCAN_IMAGE: tiny-health-app:pr-scan

jobs:
  verify:
    name: CI quality gate
    runs-on: ubuntu-latest
    # This job should become the required status check on `main`.
    # Keep the visible job name stable after your first successful run.

    steps:
      - name: Check out repository
        uses: "REPLACE_WITH_CHECKOUT_ACTION"

      - name: Set up Python
        uses: "REPLACE_WITH_SETUP_PYTHON_ACTION"
        with:
          python-version: "REPLACE_WITH_COURSE_PYTHON_VERSION"

      - name: Run tests
        run: |
          # TODO:
          # run the project unit tests
          exit 1

      - name: Run Ruff linting
        uses: "REPLACE_WITH_RUFF_ACTION"

      - name: Run Trivy filesystem scan
        uses: "REPLACE_WITH_TRIVY_ACTION"
        with:
          scan-type: "REPLACE_ME"
          scan-ref: "REPLACE_ME"
          scanners: "REPLACE_ME"
          severity: "REPLACE_ME"
          ignore-unfixed: "REPLACE_ME"
          exit-code: "REPLACE_ME"

      - name: Run Trivy Dockerfile and config scan
        uses: "REPLACE_WITH_TRIVY_ACTION"
        with:
          scan-type: "REPLACE_ME"
          scan-ref: "REPLACE_ME"
          severity: "REPLACE_ME"
          exit-code: "REPLACE_ME"

      - name: Set up Docker Buildx
        uses: "REPLACE_WITH_SETUP_BUILDX_ACTION"

      - name: Build local image for scan
        uses: "REPLACE_WITH_BUILD_PUSH_ACTION"
        with:
          context: "."
          push: false
          load: true
          tags: "${{ env.PR_SCAN_IMAGE }}"

      - name: Run Trivy image scan
        uses: "REPLACE_WITH_TRIVY_ACTION"
        with:
          image-ref: "${{ env.PR_SCAN_IMAGE }}"
          scanners: "REPLACE_ME"
          severity: "REPLACE_ME"
          ignore-unfixed: "REPLACE_ME"
          exit-code: "REPLACE_ME"

  build-and-push:
    name: Build and push release image
    if: "REPLACE_WITH_PUSH_TO_MAIN_CONDITION"
    needs:
      - verify
    runs-on: ubuntu-latest
    outputs:
      image_tag: "${{ steps.image-tag.outputs.value }}"
      image_ref: "${{ steps.image-ref.outputs.value }}"

    steps:
      - name: Check required GitHub secrets
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # TODO:
          # fail clearly if any required secret is missing
          exit 1

      - name: Check out repository
        uses: "REPLACE_WITH_CHECKOUT_ACTION"

      - name: Create image tag
        id: image-tag
        run: |
          # TODO:
          # create one traceable tag from UTC date and GITHUB_RUN_ID
          # then write it to GITHUB_OUTPUT with the key `value`
          exit 1

      - name: Create full image reference
        id: image-ref
        run: |
          # TODO:
          # combine REGISTRY_HOST, IMAGE_NAME, and the image tag
          # then write it to GITHUB_OUTPUT with the key `value`
          exit 1

      - name: Set up Docker Buildx
        uses: "REPLACE_WITH_SETUP_BUILDX_ACTION"

      - name: Log in to registry
        uses: "REPLACE_WITH_DOCKER_LOGIN_ACTION"
        with:
          registry: "${{ secrets.REGISTRY_HOST }}"
          username: "${{ secrets.REGISTRY_USERNAME }}"
          password: "${{ secrets.REGISTRY_PASSWORD }}"

      - name: Show image reference
        run: |
          # TODO:
          # print the exact image reference that will be pushed
