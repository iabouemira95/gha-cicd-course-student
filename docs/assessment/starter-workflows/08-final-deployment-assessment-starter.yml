      - name: Build and push release image
        uses: "REPLACE_WITH_BUILD_PUSH_ACTION"
        with:
          context: "."
          push: true
          tags: "${{ steps.image-ref.outputs.value }}"

  deploy-to-host:
    name: Deploy to remote host
    if: "REPLACE_WITH_PUSH_TO_MAIN_CONDITION"
    needs:
      - build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy image over SSH
        uses: "REPLACE_WITH_SSH_ACTION"
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          COMMIT_SHA: ${{ github.sha }}
          APP_PORT: ${{ env.APP_PORT }}
        with:
          host: "${{ secrets.DEPLOY_HOST }}"
          username: "${{ secrets.DEPLOY_USER }}"
          key: "${{ secrets.DEPLOY_SSH_KEY }}"
          envs: "REGISTRY_HOST,REGISTRY_USERNAME,REGISTRY_PASSWORD,IMAGE_REF,IMAGE_TAG,COMMIT_SHA,APP_PORT"
          script: |
            set -e
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

