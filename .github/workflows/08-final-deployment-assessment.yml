name: 08 Final Deployment Assessment

on:
    workflow_dispatch:

jobs:
    verify:
        name: Verify Code and Security
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Run tests
              run: python -m unittest discover -s tests -v

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "table"
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"

    prepare-output:
        name: Build and Push Docker Image
        needs: verify
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.generate_tag.outputs.TAG }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Generate Image Tag
              id: generate_tag
              run: echo "TAG=$(date +'%Y-%m-%d')-${{ github.run_id }}" >> $GITHUB_OUTPUT

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true

                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/tiny-health-app:${{
                      steps.generate_tag.outputs.TAG }}

    deploy-to-local:
        name: Deploy to Local Runner (Fast Path)
        needs: prepare-output
        runs-on: ubuntu-latest
        steps:
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Pull and Run Container
              run: |
                  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tiny-health-app:${{ needs.prepare-output.outputs.image_tag }}
                  docker stop my-app || true
                  docker rm my-app || true
                  docker run -d -p 8000:8000 --name my-app \
                    -e VERSION=${{ needs.prepare-output.outputs.image_tag }} \
                    ${{ secrets.DOCKERHUB_USERNAME }}/tiny-health-app:${{ needs.prepare-output.outputs.image_tag }}

            - name: Validate Deployment
              run: |
                  sleep 5
                  curl -s http://localhost:8000/health
                  curl -s http://localhost:8000/version
                  curl -s http://localhost:8000/status
